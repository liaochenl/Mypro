<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基期与增长量计算器</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:#f5f6f8;color:#1f2937;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px
    }
    .card{
      width:100%;max-width:560px;background:#fff;border-radius:20px;padding:28px;
      box-shadow:0 12px 35px rgba(0,0,0,.08)
    }
    h1{margin:0 0 8px;font-size:28px}
    .sub{color:#6b7280;margin-bottom:26px;line-height:1.6}
    .field{margin-bottom:18px}
    label{display:block;font-weight:600;margin-bottom:8px}
    .input-wrap{
      display:flex;align-items:center;border:1px solid #d1d5db;border-radius:12px;overflow:hidden;background:#fff
    }
    input{
      flex:1;width:100%;border:none;outline:none;padding:14px 16px;font-size:18px;background:transparent
    }
    .suffix{padding:0 14px;color:#6b7280;font-size:16px}
    button{
      width:100%;border:none;border-radius:12px;padding:14px;font-size:18px;font-weight:700;
      cursor:pointer;background:#111827;color:#fff;margin-top:4px
    }
    button:hover{opacity:.92}
    .results{margin-top:24px;display:grid;gap:14px}
    .result-box{
      background:#f9fafb;border:1px solid #e5e7eb;border-radius:14px;padding:16px
    }
    .result-title{font-size:14px;color:#6b7280;margin-bottom:6px}
    .result-value{font-size:28px;font-weight:800;word-break:break-all}
    .formula{
      margin-top:22px;padding-top:18px;border-top:1px solid #e5e7eb;color:#4b5563;line-height:1.8;font-size:14px
    }
    .error{margin-top:12px;color:#b91c1c;font-weight:600;min-height:22px}
    .hint{color:#6b7280;font-size:13px;margin-top:6px}
    @media(max-width:520px){
      body{padding:14px}.card{padding:22px 18px;border-radius:16px}h1{font-size:24px}.result-value{font-size:24px}
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>基期与增长量计算器</h1>
    <div class="sub">输入现期量和增长率，自动计算基期量与增长量。</div>

    <div class="field">
      <label for="current">现期量</label>
      <div class="input-wrap">
        <input id="current" type="number" step="any" placeholder="例如：520">
      </div>
    </div>

    <div class="field">
      <label for="rate">增长率</label>
      <div class="input-wrap">
        <input id="rate" type="number" step="any" placeholder="例如：20 或 -15">
        <span class="suffix">%</span>
      </div>
      <div class="hint">正增长填正数；下降填负数，例如下降15%输入 -15。</div>
    </div>

    <button id="calcBtn">计算</button>
    <div id="error" class="error"></div>

    <section class="results">
      <div class="result-box">
        <div class="result-title">基期量</div>
        <div id="baseResult" class="result-value">—</div>
      </div>
      <div class="result-box">
        <div class="result-title">增长量</div>
        <div id="growthResult" class="result-value">—</div>
      </div>
    </section>

    <div class="formula">
      <div><strong>基期量：</strong>现期量 ÷ (1 + 增长率)</div>
      <div><strong>增长量：</strong>现期量 − 基期量</div>
      <div>也可写为：现期量 × 增长率 ÷ (1 + 增长率)</div>
    </div>
  </main>

  <script>
    const currentInput = document.getElementById('current');
    const rateInput = document.getElementById('rate');
    const baseResult = document.getElementById('baseResult');
    const growthResult = document.getElementById('growthResult');
    const errorBox = document.getElementById('error');
    const calcBtn = document.getElementById('calcBtn');

    function formatNumber(num){
      if(!Number.isFinite(num)) return '—';
      return num.toLocaleString('zh-CN',{maximumFractionDigits:4});
    }

    function calculate(){
      errorBox.textContent='';
      const current=parseFloat(currentInput.value);
      const ratePercent=parseFloat(rateInput.value);

      if(!Number.isFinite(current)||!Number.isFinite(ratePercent)){
        errorBox.textContent='请输入有效的现期量和增长率。';
        return;
      }

      const r=ratePercent/100;
      if(1+r===0){
        errorBox.textContent='增长率不能为 -100%。';
        return;
      }

      const base=current/(1+r);
      const growth=current-base;

      baseResult.textContent=formatNumber(base);
      growthResult.textContent=formatNumber(growth);
    }

    calcBtn.addEventListener('click',calculate);

    [currentInput,rateInput].forEach(input=>{
      input.addEventListener('keydown',e=>{
        if(e.key==='Enter') calculate();
      });
      input.addEventListener('input',()=>{
        if(currentInput.value!==''&&rateInput.value!=='') calculate();
      });
    });
  </script>
</body>
</html>
